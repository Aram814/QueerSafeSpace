name: Import OSM listings

on:
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state codes (e.g. FL,GA). Leave empty for all states.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: node --test tools/osm-import/transform.test.mjs
      - name: Download listings from OpenStreetMap
        run: node tools/osm-import/import.mjs --states="${{ inputs.states }}" --out=out
      # Keep whatever finished, even if a later state fails or the run hits the time limit.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: osm-listings
          path: out/
          if-no-files-found: error
